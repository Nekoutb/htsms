<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="EA HTSMS — Your SIM. Your gateway.">
  <rect width="1200" height="630" fill="#10231d"/>
  <circle cx="980" cy="150" r="360" fill="#0b6b4d" opacity="0.35"/>
  <circle cx="1050" cy="520" r="220" fill="#c7ef74" opacity="0.12"/>
  <g transform="translate(90,90)">
    <rect x="0" y="0" width="150" height="52" rx="10" fill="#c7ef74"/>
    <text x="75" y="36" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#10231d" text-anchor="middle">EA</text>
    <text x="170" y="38" font-family="Inter, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#f4f2eb">HTSMS</text>
