name: HTSMS Android release

on:
  push:
    tags: ['android-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set — add the signing secrets before running this workflow."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > /tmp/htsms-release.jks
      - name: Build signed release APK
        env:
          HTSMS_KEYSTORE_PATH: /tmp/htsms-release.jks
          HTSMS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HTSMS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HTSMS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace
      - name: Name artifact and write checksum
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk "htsms-gateway-v${VERSION}.apk"
          sha256sum "htsms-gateway-v${VERSION}.apk" > "htsms-gateway-v${VERSION}.apk.sha256"
          cat "htsms-gateway-v${VERSION}.apk.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: htsms-gateway-release
          path: |
            android/htsms-gateway-v*.apk
            android/htsms-gateway-v*.apk.sha256
          if-no-files-found: error
          retention-days: 30
